<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>AI Voicebot Demo</title>
<style>
body{font-family:sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#1a1a2e;color:white;margin:0}
h1{font-size:1.5rem;margin-bottom:10px}
#status{font-size:1rem;color:#aaa;margin-bottom:30px;min-height:24px}
#btn{width:120px;height:120px;border-radius:50%;border:none;background:#e94560;color:white;font-size:2rem;cursor:pointer}
#btn.listening{background:#0f3460}
#transcript{margin-top:30px;max-width:500px;text-align:center;color:#ccc;font-size:0.95rem;min-height:60px;white-space:pre-line}
</style>
</head>
<body>
<h1>🤖 AI受付ボット</h1>
<div id="status">ボタンを押して話しかけてください</div>
<button id="btn" onclick="toggleListen()">🎤</button>
<div id="transcript"></div>
<script>
const API_KEY="AQ.Ab8RN6KFaW5ru1WpmtI3WCZ7FEWRYMXOXFAN-nnNsl6qGNyf_Q";
const SYSTEM_PROMPT="あなたはレストランの受付AIアシスタントです。お客様の予約を受け付けてください。必要な情報は名前、人数、日時です。日本語で丁寧に短く返答してください。";
let recognition,isListening=false,history=[];
function initSpeech(){
  recognition=new webkitSpeechRecognition();
  recognition.lang="ja-JP";
  recognition.continuous=false;
  recognition.interimResults=false;
  recognition.onresult=async(e)=>{
    const txt=e.results[0][0].transcript;
    document.getElementById("transcript").innerText="あなた: "+txt;
    document.getElementById("status").innerText="考え中...";
    setL(false);
    await send(txt);
  };
  recognition.onerror=()=>{document.getElementById("status").innerText="エラー。もう一度お試しください。";setL(false)};
  recognition.onend=()=>setL(false);
}
function setL(v){
  isListening=v;
  document.getElementById("btn").className=v?"listening":"";
  document.getElementById("btn").innerText=v?"⏹":"🎤";
}
function toggleListen(){
  if(!recognition)initSpeech();
  if(isListening){recognition.stop();setL(false)}
  else{recognition.start();setL(true);document.getElementById("status").innerText="聞いています..."}
}
async function send(txt){
  history.push({role:"user",parts:[{text:txt}]});
  const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key="+API_KEY,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({system_instruction:{parts:[{text:SYSTEM_PROMPT}]},contents:history})
  });
  const d=await r.json();
  const bot=d.candidates?.[0]?.content?.parts?.[0]?.text||"すみません、もう一度お願いします。";
  history.push({role:"model",parts:[{text:bot}]});
  document.getElementById("transcript").innerText="あなた: "+txt+"\n\nボット: "+bot;
  document.getElementById("status").innerText="返答中...";
  const u=new SpeechSynthesisUtterance(bot);
  u.lang="ja-JP";
  u.onend=()=>document.getElementById("status").innerText="ボタンを押して話しかけてください";
  speechSynthesis.speak(u);
}
</script>
</body>
</html>
